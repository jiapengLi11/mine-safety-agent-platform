name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress clean verify

  agent-eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install evaluation dependencies
        run: pip install --disable-pip-version-check -r evals/requirements.txt

      - name: Test evaluation logic
        run: python -m unittest discover -s evals/tests -v

      - name: Run deterministic release gate
        run: python evals/run_eval.py --target rule --profile ci --enforce-gate --output-dir /tmp/mineguard-eval
